{% if page.image %}
<figure style="margin: 25px 0; text-align: center;">
    <img src="{{ page.image | relative_url }}" 
         alt="{{ page.image_alt | default: page.title }}" 
         loading="lazy"
         style="max-width: 100%; border-radius: 16px; border: 1px solid var(--border-color); display: block; margin: 0 auto;">
</figure>
{% endif %}
