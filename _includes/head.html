<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">

<!-- SEO Básico -->
<meta name="description" content="Guia completo de significados das horas iguais, números, sonhos e ferramentas de numerologia.">
<meta name="robots" content="index, follow">

<!-- Open Graph / Facebook / WhatsApp -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: 'Portal Significados' }}">
<meta property="og:description" content="{{ page.description | default: 'Desvende os mistérios dos signos, números e sinais do universo.' }}">
<meta property="og:image" content="/assets/og-image.jpg">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">

<!-- Twitter Cards -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: 'Portal Significados' }}">
<meta name="twitter:description" content="{{ page.description | default: 'Desvende os mistérios dos signos, números e sinais do universo.' }}">
<meta name="twitter:image" content="/assets/og-image.jpg">
