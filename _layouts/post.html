---
layout: default
---

<main class="main-content container post-container">
    <div class="breadcrumbs">
        <a href="{{ '/' | relative_url }}">Início</a>
        {% if page.category_slug %}
            &gt; <a href="{{ '/' | append: page.category_slug | append: '/' | relative_url }}">{{ page.category_name }}</a>
        {% endif %}
        &gt; <span>{{ page.title }}</span>
    </div>

    <article class="post-content">
        {{ content }}
    </article>
</main>
