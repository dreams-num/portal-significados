---
layout: default
---

<main class="main-content container">
    <div class="breadcrumbs">
        <a href="/">Início</a>
        {% if page.category_slug %}
            &gt; <a href="/{{ page.category_slug }}/">{{ page.category_name }}</a>
        {% endif %}
        &gt; <span>{{ page.title }}</span>
    </div>

    <article class="post-article">
        <h1>{{ page.title }}</h1>
        <p class="post-meta">Atualizado para consulta em Portal de Significados</p>

        {% if page.toc != false %}
        <div class="table-of-contents" id="toc">
            <h3>O que você verá neste artigo:</h3>
            <!-- O índice pode ser preenchido via JS ou plugin -->
        </div>
        {% endif %}

        <div class="post-content">
            {{ content }}
        </div>
    </article>
</main>
